[project]
name = "simpy-stats"
version = "0.2.0"
description = "Arena-like statistics layer for SimPy: Counter, Tally, Level, replications, and CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kerem Demirtas" }]
keywords = ["simpy", "simulation", "statistics", "discrete-event"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "simpy>=4.0",
]

[project.urls]
Repository = "https://github.com/kdemirtas/simpy-stats"
Issues = "https://github.com/kdemirtas/simpy-stats/issues"

[project.optional-dependencies]
scipy = ["scipy>=1.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
